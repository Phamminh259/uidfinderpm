# Mỗi lần push code lên nhánh master:
# 1. Kiểm tra build + test.
# 2. Nếu thành công, tự động SSH vào VPS để cập nhật website.
name: Deploy to VPS

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  SITE_URL: https://uidfinder.site

jobs:
  check:
    name: Kiểm tra (build + test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài thư viện
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate Prisma Client
        run: npx prisma generate --schema apps/backend/prisma/schema.prisma

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}

      - name: Test
        run: npm run test

      - name: Lint
        run: npm run lint
        continue-on-error: true

  deploy:
    name: Cập nhật VPS
    needs: [check]

    # Chỉ deploy khi push master hoặc chạy workflow_dispatch trên master.
    if: |
      github.ref == 'refs/heads/master' &&
      github.event_name != 'pull_request'

    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Chuẩn bị SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Chạy lệnh cập nhật trên VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -p "${VPS_PORT:-22}" \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_SHA=$DEPLOY_SHA BRANCH=master bash -s" \
            < infrastructure/scripts/deploy-on-vps.sh

      - name: Kiểm tra website sau khi deploy
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${SITE_URL}/api/health" || true)

            echo "Lần $i: HTTP $code"

            if [ "$code" = "200" ]; then
              echo "Deploy thành công!"
              exit 0
            fi

            sleep 10
          done

          echo "Website không phản hồi HTTP 200 sau khi deploy."
          exit 1
